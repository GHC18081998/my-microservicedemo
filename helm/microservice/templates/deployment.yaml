{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $svc.namespace }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
      - name: {{ $name }}
        # Direct injection from Jenkins:
        image: "{{ $svc.image }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        resources:
          requests:
            cpu: "{{ $svc.resources.requests.cpu }}"
            memory: "{{ $svc.resources.requests.memory }}"
          limits:
            cpu: "{{ $svc.resources.limits.cpu }}"
            memory: "{{ $svc.resources.limits.memory }}"
        ports:
        - containerPort: {{ $svc.port }}
          name: http
        env:
        - name: PORT
          value: "{{ $svc.port }}"
        {{- if $svc.dbName }}
        - name: DB_HOST
          value: {{ $.Values.database.host | quote }}
        - name: DB_PORT
          value: {{ $.Values.database.port | quote }}
        - name: DB_NAME
          value: {{ $svc.dbName | quote }}
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.database.secretName }}
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.database.secretName }}
              key: password
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://{{ $.Values.database.host }}:{{ $.Values.database.port }}/{{ $svc.dbName }}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
        - name: SPRING_DATASOURCE_USERNAME
          value: "$(DB_USER)"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "$(DB_PASSWORD)"
        {{- end }}
        {{- if $svc.env }}
{{ toYaml $svc.env | indent 8 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: {{ $svc.port }}
          initialDelaySeconds: 40
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: {{ $svc.port }}
          initialDelaySeconds: 40
          periodSeconds: 10
{{- end }}
{{- end }}
