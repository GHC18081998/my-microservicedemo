server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: gateway-service
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service.auth-ns.svc.cluster.local:8081}
          predicates:
            - Path=/api/auth/**, /login, /logout, /forgot-password, /reset-password, /login.css, /forget-password.css, /reset-password.css, /favicon.svg, /favicon.ico

        - id: user-service
          uri: ${USER_SERVICE_URL:http://user-service.user-ns.svc.cluster.local:8082}
          predicates:
            - Path=/api/users/**

        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://admin-service.admin-ns.svc.cluster.local:8083}
          predicates:
            - Path=/admin/**, /superadmin/**, /api/admin/**

        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:http://customer-service.customer-ns.svc.cluster.local:8084}
          predicates:
            - Path=/api/customers/**, /customer/**

        - id: employee-service
          uri: ${EMPLOYEE_SERVICE_URL:http://employee-service.employee-ns.svc.cluster.local:8085}
          predicates:
            - Path=/employee/**, /api/employee/**

        - id: hr-service
          uri: ${HR_SERVICE_URL:http://hr-service.hr-ns.svc.cluster.local:8086}
          predicates:
            - Path=/hr/**, /api/hr/**, /api/payroll/**

        - id: task-service
          uri: ${TASK_SERVICE_URL:http://task-service.task-ns.svc.cluster.local:8087}
          predicates:
            - Path=/api/tasks/**

app:
  jwt:
    secret: ${JWT_SECRET:Y3JtU2VjcmV0S2V5Rm9yVGVuYW50Q3JtQXBwbGljYXRpb24yMDI2}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
